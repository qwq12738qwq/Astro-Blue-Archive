name: Astro Inspection

on:
  pull_request:
    paths:
      - 'astro/**/*.astro'
      - 'astro/astro.config.*'
      - 'astro/src/**'
      - 'astro/public/**'
      - 'astro/package.json'
      - 'astro/package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: cd astro && npm ci

      - name: Build Astro
        run: cd astro && npm run build